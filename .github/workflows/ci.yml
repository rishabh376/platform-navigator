name: ci
on:
  push: { branches: [] }
  pull_request: { branches: [] }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci || npm i
      - run: npm test || true
      - uses: aquasecurity/trivy-action@master
        with: { scan-type: fs, scan-ref: '.' }
