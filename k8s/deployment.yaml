apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-navigator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: platform-navigator
  template:
    metadata:
      labels:
        app: platform-navigator
    spec:
      containers:
      - name: app
        image: ghcr.io/example/platform-navigator:latest
        ports:
        - containerPort: 8080
        livenessProbe: { httpGet: { path: /healthz, port: 8080 } }
        readinessProbe: { httpGet: { path: /healthz, port: 8080 } }
